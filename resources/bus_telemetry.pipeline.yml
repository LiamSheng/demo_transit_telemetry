resources:
  pipelines:
    bus_telemetry_pipeline:
      name: bus_telemetry_pipeline

      catalog: ${var.catalog}
      schema: ${var.schema}

      serverless: true
      continuous: false

      configuration:
        transit.source_path: /Volumes/${var.catalog}/${var.schema}/transit_landing/raw/bus_telemetry
        spark.sql.session.timeZone: UTC

      libraries:
        - file:
            path: ../src/bus_telemetry_pipeline.py
