resources:
  pipelines:
    bus_telemetry_pipeline:
      name: bc_transit_bus_telemetry_pipeline

      catalog: ${var.catalog}
      schema: ${var.schema}

      serverless: true
      continuous: false

      configuration:
        transit.sources.bus_telemetry.path: /Volumes/${var.catalog}/${var.schema}/transit_landing/raw/bus_telemetry
        spark.sql.session.timeZone: UTC
        transit.rules.low_battery_pct: "10"
        transit.rules.ingest_delay_seconds: "30"
        transit.rules.telemetry_gap_seconds: "300"

      libraries:
        - file:
            path: ../src/pipelines/bronze/bus_telemetry.py

        - file:
            path: ../src/pipelines/silver/bus_telemetry.py

        - file:
            path: ../src/pipelines/gold/bus_sensor_readings.py

        - file:
            path: ../src/pipelines/gold/bus_sensor_anomalies.py
